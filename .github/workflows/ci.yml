name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install portal deps
        run: python -m pip install --upgrade pip && pip install -r standup/portal/requirements.txt

      - name: Portal test suite
        # The suite mocks every `claude -p` call (no CLI needed in CI) and uses isolated
        # temp STANDUP_ROOTs, so it runs hermetically.
        working-directory: standup/portal
        run: python -m pytest -q

      - name: demo-app test suite
        working-directory: demo-app
        run: pip install pytest && python -m pytest -q
