name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  selftest:
    # Windows is in the matrix on purpose: v1 parsed Windows paths with POSIX shlex and refused
    # every job there, and CI (ubuntu only) never saw it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the hooks (bakes this runner's interpreter, smoke-runs the guard)
        run: python .agentteam/bin/setup.py
      - name: Agent files and ARCHITECTURE.md are generated, not hand-edited
        run: |
          python .agentteam/bin/roster.py --check
          python .agentteam/bin/architecture.py --check
      - name: Selftest — every check must be shown to fail (E-03)
        run: python .agentteam/bin/selftest.py
      - name: Design judge self-test (phase 6)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          node .agentteam/bin/visual/verify_design_quality.js --self-test
